name: Replicate gpt-instruct

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replicate:
    if: "!contains(github.event.head_commit.message, '[replicate]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source
        run: git clone --depth 1 https://github.com/MDX-Tom/gpt-instruct.git /tmp/gpt-instruct

      - name: Replace destination except workflows
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/gpt-instruct/ ./
          git status --short

      - name: Commit source working tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Destination already matches source outside workflows."
            exit 0
          fi
          git commit -m "Replicate MDX-Tom/gpt-instruct main [replicate]"
          git push origin HEAD:main
